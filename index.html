<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Resume Analyzer</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1c2030; --muted: #667085;
    --line: #e4e7ee; --brand: #5b4bdb; --good: #15803d; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c; --card: #1b1e29; --text: #eceef5; --muted: #9aa1b5;
      --line: #2b3042; --brand: #8b7dff; --good: #4ade80; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 20px; margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  input[type=file], textarea { width: 100%; padding: 10px; border: 1px solid var(--line);
          border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 150px; resize: vertical; }
  .field { margin-bottom: 16px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 10px;
           padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--bad); margin-top: 12px; }
  .score { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .score-num { font-size: 44px; font-weight: 700; color: var(--brand); }
  .bar { flex: 1; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  .chip { padding: 4px 12px; border-radius: 99px; font-size: 14px; border: 1px solid var(--line); }
  .chip.good { color: var(--good); border-color: var(--good); }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  h3 { margin: 16px 0 4px; font-size: 16px; }
  ol { padding-left: 20px; margin: 4px 0; }
  .hist { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0;
          border-top: 1px solid var(--line); cursor: pointer; }
  .hist:first-of-type { border-top: 0; }
  .hist small { color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>AI Resume Analyzer</h1>
  <p class="sub">Upload your resume, paste a job description, and see how well they match.</p>

  <section class="card">
    <div class="field">
      <label for="resume">Resume (PDF, max 4 MB)</label>
      <input id="resume" type="file" accept="application/pdf">
    </div>
    <div class="field">
      <label for="jd">Job description</label>
      <textarea id="jd" placeholder="Paste the full job description here..."></textarea>
    </div>
    <button id="go">Analyze</button>
    <div id="error" class="error"></div>
  </section>

  <section id="result" class="card hidden"></section>

  <section class="card">
    <h3 style="margin-top:0">Recent analyses</h3>
    <div id="history"><small>Loading...</small></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

// Calls the backend and gives clear errors instead of "Unexpected token '<'"
async function api(path, options) {
  const res = await fetch(path, options);
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch {
    throw new Error("Server did not return JSON (status " + res.status + "). Is the Flask server running?");
  }
  if (!res.ok) throw new Error(data.error || data.message || "Request failed (" + res.status + ")");
  return data;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;   // textContent keeps it XSS-safe
  return node;
}

function chips(list, kind) {
  const wrap = el("div", "chips");
  list.forEach((s) => wrap.appendChild(el("span", "chip " + kind, s)));
  if (!list.length) wrap.appendChild(el("small", "", "None"));
  return wrap;
}

function renderResult(r) {
  const box = $("result");
  box.replaceChildren();

  const score = el("div", "score");
  score.appendChild(el("div", "score-num", r.match_score + "/100"));
  const bar = el("div", "bar");
  const fill = el("div");
  fill.style.width = r.match_score + "%";
  bar.appendChild(fill);
  score.appendChild(bar);
  box.appendChild(score);

  box.appendChild(el("p", "", r.summary));
  box.appendChild(el("h3", "", "Matched skills"));
  box.appendChild(chips(r.matched_skills, "good"));
  box.appendChild(el("h3", "", "Missing skills"));
  box.appendChild(chips(r.missing_skills, "bad"));
  box.appendChild(el("h3", "", "Suggestions"));
  const ol = el("ol");
  r.suggestions.forEach((s) => ol.appendChild(el("li", "", s)));
  box.appendChild(ol);

  if (r.keywords_missing && r.keywords_missing.length) {
    box.appendChild(el("h3", "", "Other keywords from the job description"));
    box.appendChild(chips(r.keywords_missing, "bad"));
  }
  if (r.checks) {
    box.appendChild(el("h3", "", "Resume checklist"));
    const ul = el("ul");
    r.checks.forEach((c) => ul.appendChild(el("li", "", (c.passed ? "\u2713 " : "\u2717 ") + c.label)));
    box.appendChild(ul);
  }
  if (r.ai_feedback) {
    box.appendChild(el("h3", "", "AI feedback"));
    const p = el("p", "", r.ai_feedback);
    p.style.whiteSpace = "pre-wrap";
    box.appendChild(p);
  }

  box.classList.remove("hidden");
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function analyze() {
  const file = $("resume").files[0];
  const jd = $("jd").value.trim();
  $("error").textContent = "";

  if (!file) return ($("error").textContent = "Please choose a PDF resume.");
  if (file.size > 4 * 1024 * 1024) return ($("error").textContent = "PDF is larger than 4 MB.");
  if (jd.length < 30) return ($("error").textContent = "Please paste a longer job description.");

  $("go").disabled = true;
  $("go").textContent = "Analyzing...";
  try {
    const form = new FormData();
    form.append("resume", file);
    form.append("job_description", jd);
    const data = await api("/analyze", { method: "POST", body: form });
    renderResult(data);
    loadHistory();
  } catch (err) {
    $("error").textContent = err.message;
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Analyze";
  }
}

async function loadHistory() {
  const box = $("history");
  try {
    const items = await api("/history");
    box.replaceChildren();
    if (!items.length) return box.appendChild(el("small", "", "No analyses yet."));
    items.forEach((item) => {
      const row = el("div", "hist");
      const left = el("div");
      left.appendChild(el("strong", "", item.filename));
      left.appendChild(el("br"));
      left.appendChild(el("small", "", new Date(item.created_at * 1000).toLocaleString()));
      row.appendChild(left);
      row.appendChild(el("strong", "", item.match_score + "/100"));
      row.addEventListener("click", () => renderResult(item));
      box.appendChild(row);
    });
  } catch (err) {
    box.replaceChildren(el("small", "", "Could not load history: " + err.message));
  }
}

$("go").addEventListener("click", analyze);
loadHistory();
</script>
</body>
</html>
